name: Collection CRUD Smoke

on:
  push:
    branches:
      - main
    paths:
      - "scripts/collection-crud-smoke.sh"
      - ".github/workflows/collection-crud-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"

jobs:
  smoke:
    runs-on: [self-hosted, linux, x64, cardyssey-android]
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Production collection CRUD smoke
        run: bash scripts/collection-crud-smoke.sh
