name: Export Android Admin Client

on:
  push:
    paths:
      - '.github/workflows/export-android-admin-client.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Android client
        run: |
          python3 scripts/write-contract.py
          bash scripts/generate-clients.sh
      - name: Export Admin generated sources
        run: |
          rm -rf .android-admin-export
          mkdir -p .android-admin-export/apis .android-admin-export/models
          cp generated/android-client/src/main/kotlin/de/cardyssey/generated/apis/AdminApi.kt .android-admin-export/apis/
          for f in AdminAccessResponse AdminOverviewResponse AdminUserSummaryResponse AdminUserDetailResponse AdminCollectionItemResponse AdminWishlistItemResponse AdminListingResponse FounderSystemResponse; do
            cp "generated/android-client/src/main/kotlin/de/cardyssey/generated/models/${f}.kt" .android-admin-export/models/
          done
      - name: Commit export and remove helper
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f .android-admin-export
          git rm .github/workflows/export-android-admin-client.yml
          git commit -m "chore: export generated Android admin client"
          git push origin HEAD:main
