name: Platform CI

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "platform/api/**"
      - "contracts/**"
      - "scripts/write-contract.py"
      - "scripts/enrich-admin-contract.py"
      - "scripts/generate-clients.sh"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "platform/api/**"
      - "contracts/**"
      - "scripts/write-contract.py"
      - "scripts/enrich-admin-contract.py"
      - "scripts/generate-clients.sh"
      - ".github/workflows/platform-ci.yml"

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    timeout-minutes: 30
    runs-on: [self-hosted, linux, x64, cardyssey-android]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate API clients
        working-directory: .
        run: bash scripts/generate-clients.sh
      - name: Install dependencies
        run: npm ci
      - name: Typecheck web
        run: npm run typecheck
      - name: Build web
        env:
          CARDYSSEY_API_URL: http://127.0.0.1:8081
          NEXT_PUBLIC_SHOP_URL: https://shop.cardyssey.de
        run: npm run build

  backend:
    timeout-minutes: 30
    needs: web
    if: always() && !cancelled()
    runs-on: [self-hosted, linux, x64, cardyssey-android]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build backend image
        run: |
          docker run --rm --memory=3g --cpus=2 --user "$(id -u):$(id -g)" \
            -e GRADLE_USER_HOME=/tmp/gradle -v "$PWD/platform/api:/app" -w /app \
            gradle:8.13-jdk21 gradle test --no-daemon --max-workers=2
          docker build -t cardyssey-api-ci ./platform/api
