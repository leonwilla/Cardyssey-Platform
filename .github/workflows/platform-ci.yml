name: Platform CI

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "platform/api/**"
      - "contracts/**"
      - "scripts/write-contract.py"
      - "scripts/enrich-admin-contract.py"
      - "scripts/generate-clients.sh"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "web/**"
      - "platform/api/**"
      - "contracts/**"
      - "scripts/write-contract.py"
      - "scripts/enrich-admin-contract.py"
      - "scripts/generate-clients.sh"
      - ".github/workflows/platform-ci.yml"

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate API clients
        working-directory: .
        run: bash scripts/generate-clients.sh
      - name: Install dependencies
        run: npm ci
      - name: Build web
        env:
          CARDYSSEY_API_URL: http://127.0.0.1:8081
          NEXT_PUBLIC_SHOP_URL: https://shop.cardyssey.de
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build backend image
        run: docker build -t cardyssey-api-ci ./platform/api
