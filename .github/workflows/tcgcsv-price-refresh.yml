name: Weekly TCGCSV Price Refresh

on:
  schedule:
    - cron: "17 4 * * 0"
  workflow_dispatch:

concurrency:
  group: weekly-tcgcsv-price-refresh
  cancel-in-progress: false

jobs:
  refresh:
    timeout-minutes: 180
    runs-on: [self-hosted, linux, x64, cardyssey-android]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test exact retail price matching
        id: price_tests
        run: |
          python3 scripts/test-price-coverage.py
          python3 scripts/test-price-source-round2.py
          python3 scripts/test-price-round3.py
          python3 scripts/test-price-round5.py
          python3 scripts/test-price-round6.py
          python3 scripts/test-price-round7.py
          python3 scripts/test-price-round8.py
          python3 scripts/test-price-round9.py
          python3 scripts/test-price-round11.py
          python3 scripts/test-price-round12.py
          python3 scripts/test-price-round13.py
          python3 scripts/test-price-round15.py
          python3 scripts/test-price-round16.py
          python3 scripts/test-pokewallet-client.py
          python3 scripts/test-pokewallet-prices.py

      - name: Resolve exact modern Japanese deck and promo references
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 65
        run: |
          timeout 3750s python3 scripts/resolve-japanese-bulk-retail-prices.py --apply --report /tmp/cardyssey-japanese-bulk-weekly.json

      - name: Resolve BlackRoseSkulls Korean singles
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          timeout 420s python3 scripts/resolve-blackrose-ko-prices.py --apply --report /tmp/cardyssey-blackrose-ko-weekly.json
      - name: Resolve NeroCards Korean singles
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          timeout 420s python3 scripts/resolve-shopify-ko-prices.py --shop nero --apply --report /tmp/cardyssey-nero-ko-weekly.json
      - name: Resolve CardAnvil Korean singles
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          timeout 240s python3 scripts/resolve-shopify-ko-prices.py --shop anvil --apply --report /tmp/cardyssey-anvil-ko-weekly.json

      - name: Resolve True Unicorn Korean singles
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: timeout 240s python3 scripts/resolve-unicorn-ko-prices.py --apply --report /tmp/cardyssey-unicorn-ko-prices.json

      - name: Reactivate deferred market prices
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/reactivate-pending-market-prices.py

      - name: Backfill curated catalog variants
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/backfill-curated-tangela-sm10.py

      - name: Backfill verified special TCGplayer variants
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/backfill-tcgcsv-special-variants.py

      - name: Refresh exact PriceCharting Ungraded quotes (optional licensed access)
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/refresh-pricecharting-exact.py --apply --report /tmp/cardyssey-pricecharting-weekly.json

      - name: Refresh verified TCGCSV prices
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/refresh-tcgcsv-price-cache.py

      - name: Refresh verified Cardmarket prices and persist unresolved diagnostics
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: |
          python3 scripts/refresh-cardmarket-price-cache.py --fallback-report /tmp/cardyssey-weekly-price-review.json
          python3 scripts/store-price-review-cases.py --report /tmp/cardyssey-weekly-price-review.json --apply
          python3 scripts/audit-tcgcsv-exact-variant-prices.py --input /tmp/cardyssey-weekly-price-review.json --output /tmp/cardyssey-weekly-exact-id-audit.json
          python3 scripts/annotate-price-review-tcgcsv.py --report /tmp/cardyssey-weekly-exact-id-audit.json --apply
          python3 scripts/audit-cardtrader-exact-stock.py --input /tmp/cardyssey-weekly-price-review.json --output /tmp/cardyssey-weekly-cardtrader-stock-audit.json
          python3 scripts/annotate-price-review-cardtrader.py --report /tmp/cardyssey-weekly-cardtrader-stock-audit.json --apply
          python3 scripts/refresh-staged-reference-prices.py --apply --report /tmp/cardyssey-weekly-reference-refresh.json
          python3 scripts/stage-english-german-comparators.py --apply
          python3 scripts/verify-reference-price-identity.py --apply

      - name: Refresh CardTrader marketplace prices
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardtrader-semantic.py

      - name: Resolve classic Japanese printings
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardtrader-ja-classic.py

      - name: Resolve Japanese reverse printings
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardtrader-ja-reverse.py

      - name: Resolve classic Japanese sequence sets
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardtrader-ja-sequence.py

      - name: Resolve PMCG1 exact artwork prices
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardtrader-pmcg1-art.py

      - name: Resolve PMCG3 exact artwork prices
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardtrader-pmcg3-art.py

      - name: Resolve Japanese Pokédex identities
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardtrader-ja-dex.py

      - name: Resolve Japanese promo prices
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardtrader-ja-promos.py

      - name: Resolve Japanese promo prices from CardRush
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardrush-ja-promos.py --apply

      - name: Resolve Japanese numbered prices from CardRush
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardrush-ja-numbered.py --apply

      - name: Resolve Japanese edition prices from CardRush
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardrush-ja-editions.py --apply

      - name: Resolve special promo prices
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardtrader-specials.py

      - name: Resolve exact named TCGCSV specials
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-tcgcsv-named-specials.py

      - name: Resolve exact western leftovers
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 4
        run: timeout 180s python3 scripts/resolve-cardtrader-western-safe.py --apply --report /tmp/cardyssey-western-weekly.json

      - name: Review exact English unavailable and unissued leftovers
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 4
        run: timeout 180s python3 scripts/review-english-price-leftovers.py --apply --report /tmp/cardyssey-english-review-weekly.json

      - name: Resolve Traditional Chinese special printings
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardtrader-zhtw-specials.py

      - name: Resolve audited Traditional Chinese art identities
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardtrader-zhtw-art-mapped.py

      - name: Refresh exact in-stock Traditional Chinese retail offers
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 4
        run: timeout 180s python3 scripts/resolve-zhtw-retailer-prices.py --apply

      - name: Refresh exact CardLand Traditional Chinese offers
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 4
        run: timeout 180s python3 scripts/resolve-cardland-zhtw-prices.py --apply

      - name: Resolve Traditional Chinese retail reference prices
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-hktcg-zhtw.py --apply

      - name: Bridge exact CardTrader identities to Cardmarket
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/resolve-cardmarket-cardtrader-bridge.py

      - name: Refresh exact in-stock Korean retail offers
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: timeout 240s python3 scripts/resolve-uturi-ko-prices.py --apply --report /tmp/cardyssey-uturi-weekly.json

      - name: Refresh exact Near Mint Korean offers from Mewtwo
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: timeout 240s python3 scripts/resolve-mewtwo-ko-prices.py --apply --report /tmp/cardyssey-mewtwo-weekly.json

      - name: Refresh exact Near Mint Korean offers from Lake Cards
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: timeout 240s python3 scripts/resolve-shopify-ko-prices.py --shop lake --apply --report /tmp/cardyssey-lake-weekly.json

      - name: Refresh exact Near Mint Korean offers from ManaMarket
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: timeout 240s python3 scripts/resolve-shopify-ko-prices.py --shop mana --apply --report /tmp/cardyssey-mana-weekly.json

      - name: Refresh exact Near Mint Korean offers from Level Up Games
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: timeout 240s python3 scripts/resolve-extra-ko-prices.py --shop level --apply --report /tmp/cardyssey-level-weekly.json

      - name: Refresh exact Near Mint Korean offers from ShinyCardboard4U
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: timeout 240s python3 scripts/resolve-extra-ko-prices.py --shop shiny --apply --report /tmp/cardyssey-shiny-weekly.json

      - name: Recover exact Korean CardTrader Near Mint booster offers
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 16
        run: timeout 900s python3 scripts/resolve-cardtrader-ko-nm-prices.py --apply --report /tmp/cardyssey-cardtrader-ko-weekly.json

      - name: Recover exact Japanese ordinary booster offers
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 21
        run: timeout 1200s python3 scripts/resolve-cardtrader-ja-nm-prices.py --apply --report /tmp/cardyssey-cardtrader-ja-weekly.json

      - name: Refresh exact Japanese edition and numbered promo offers
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 3
        run: timeout 120s python3 scripts/resolve-hareruya-ja-prices.py --apply --report /tmp/cardyssey-hareruya-weekly.json

      - name: Refresh curated exact Japanese classic-edition offers
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 5
        run: timeout 240s python3 scripts/resolve-torecacamp-ja-prices.py --apply --report /tmp/cardyssey-toreca-weekly.json

      - name: Recover verified catalogue duplicate variants and prices
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 1
        run: timeout 40s python3 scripts/repair-verified-catalog-twins.py --apply

      - name: Annotate unresolved price backlog
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        run: python3 scripts/annotate-price-backlog.py

      - name: Resolve Japanese PokéWallet market estimates
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          if [ -f /home/tv/.config/cardyssey/secrets/pokewallet-api-key ]; then
            timeout 540s python3 scripts/resolve-pokewallet-ja-market-prices.py --apply --max-requests 50 --report /tmp/cardyssey-pokewallet-ja-weekly.json
          else
            echo "PokéWallet key not configured; skipping"
          fi

      - name: Resolve Japanese TCGCSV market estimates
        if: ${{ !cancelled() && steps.price_tests.outcome == 'success' }}
        timeout-minutes: 8
        run: timeout 420s python3 scripts/resolve-tcgcsv-ja-market-prices.py --apply --report /tmp/cardyssey-tcgcsv-ja-weekly.json

      - name: Audit full physical catalog price coverage
        if: always()
        run: python3 scripts/audit-price-coverage.py

      - name: Audit catalogue identity conflicts
        if: always()
        timeout-minutes: 1
        run: timeout 40s python3 scripts/audit-catalog-identity-conflicts.py --report /tmp/cardyssey-catalog-conflicts-weekly.json

      - name: Preserve exact retail evidence and review candidates
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exact-asian-retail-evidence
          path: |
            /tmp/cardyssey-uturi-weekly.json
            /tmp/cardyssey-mewtwo-weekly.json
            /tmp/cardyssey-lake-weekly.json
            /tmp/cardyssey-mana-weekly.json
            /tmp/cardyssey-level-weekly.json
            /tmp/cardyssey-shiny-weekly.json
            /tmp/cardyssey-cardtrader-ko-weekly.json
            /tmp/cardyssey-cardtrader-ja-weekly.json
            /tmp/cardyssey-hareruya-weekly.json
            /tmp/cardyssey-toreca-weekly.json
            /tmp/cardyssey-western-weekly.json
            /tmp/cardyssey-english-review-weekly.json
            /tmp/cardyssey-unicorn-ko-prices.json
            /tmp/cardyssey-tcgcsv-ja-weekly.json
            /tmp/cardyssey-pokewallet-ja-weekly.json
            /tmp/cardyssey-blackrose-ko-weekly.json
            /tmp/cardyssey-japanese-bulk-weekly.json
            /tmp/cardyssey-nero-ko-weekly.json
            /tmp/cardyssey-anvil-ko-weekly.json
            /tmp/cardyssey-catalog-conflicts-weekly.json
          if-no-files-found: ignore
          retention-days: 14

  japanese-image-prints:
    timeout-minutes: 85
    runs-on: [self-hosted, linux, x64, cardyssey-android]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Prepare isolated full-card image reader
        run: |
          python3 -m venv /tmp/cardyssey-japanese-image-weekly-venv
          /tmp/cardyssey-japanese-image-weekly-venv/bin/pip install -r scripts/japanese-image-price-requirements.txt
      - name: Test exact image-backed Japanese print matching
        id: image_tests
        run: |
          /tmp/cardyssey-japanese-image-weekly-venv/bin/python scripts/test-price-round18.py
          /tmp/cardyssey-japanese-image-weekly-venv/bin/python scripts/test-price-round18.py --postgres
      - name: Recover and refresh verified Japanese full-card print references
        if: ${{ !cancelled() && steps.image_tests.outcome == 'success' }}
        timeout-minutes: 80
        run: |
          timeout 4740s /tmp/cardyssey-japanese-image-weekly-venv/bin/python scripts/resolve-japanese-image-print-prices.py --apply --report /tmp/cardyssey-japanese-image-weekly.json
      - name: Preserve exact image-backed print evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: japanese-full-card-print-evidence
          path: /tmp/cardyssey-japanese-image-weekly.json
          if-no-files-found: ignore
          retention-days: 14
