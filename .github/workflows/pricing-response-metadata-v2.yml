name: Pricing Response Metadata V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pricing-response-metadata-v2.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('platform/api/src/main/kotlin/de/cardyssey/api/CardPricing.kt')
          text = p.read_text()
          if 'val sampleCount: Int?' not in text:
              text = text.replace(
                  '    val exactVariantMatch: Boolean\n)',
                  '    val exactVariantMatch: Boolean,\n    val sampleCount: Int? = null,\n    val updatedAtMs: Long? = null\n)',
                  1
              )
          p.write_text(text)

          p = Path('platform/api/src/main/kotlin/de/cardyssey/api/ExternalPricingProviders.kt')
          text = p.read_text()
          if 'private data class SoldSummary' not in text:
              text = text.replace(
                  ') {\n    private val json = Json { ignoreUnknownKeys = true }',
                  ') {\n    private data class SoldSummary(\n        val baseEur: Double,\n        val sampleCount: Int,\n        val updatedAtMs: Long\n    )\n\n    private val json = Json { ignoreUnknownKeys = true }',
                  1
              )

          text, n = re.subn(
              r'''        val baseEur = if \(\n            apiKey\.isNotBlank\(\) && exactLanguageMatch && selected != null\n        \) \{\n            soldMedian\(details, selected\)\n        \} else null''',
              '''        val sold = if (\n            apiKey.isNotBlank() && exactLanguageMatch && selected != null\n        ) {\n            soldSummary(details, selected)\n        } else null\n\n        val baseEur = sold?.baseEur''',
              text,
              count=1
          )
          if n != 1 and 'val sold = if (' not in text:
              raise SystemExit('could not patch ebay quote')

          if 'sampleCount = sold?.sampleCount' not in text:
              text = text.replace(
                  '            exactVariantMatch = exactVariantMatch\n        )',
                  '            exactVariantMatch = exactVariantMatch,\n            sampleCount = sold?.sampleCount,\n            updatedAtMs = sold?.updatedAtMs\n        )',
                  1
              )

          text = text.replace(
              '    private suspend fun soldMedian(\n',
              '    private suspend fun soldSummary(\n',
              1
          )
          text = text.replace(
              '    ): Double? {\n        val printedNumber =',
              '    ): SoldSummary? {\n        val printedNumber =',
              1
          )
          text, n = re.subn(
              r'''        return median\(trimmed\)\.takeIf \{ it\.isFinite\(\) && it > 0\.0 \}\n    \}''',
              '''        val baseEur = median(trimmed)\n            .takeIf { it.isFinite() && it > 0.0 }\n            ?: return null\n\n        return SoldSummary(\n            baseEur = baseEur,\n            sampleCount = trimmed.size,\n            updatedAtMs = System.currentTimeMillis()\n        )\n    }''',
              text,
              count=1
          )
          if n != 1 and 'return SoldSummary(' not in text:
              raise SystemExit('could not patch sold summary return')

          text = re.sub(
              r'''private fun normalizeNumber\(raw: String\): String =\n    raw\.trim\(\)\.lowercase\(Locale\.ROOT\)\.replace\("\^0\+\(\?=\\\\d\)"\.toRegex\(\), ""\)''',
              '''private fun normalizeNumber(raw: String): String =\n    raw.trim()\n        .lowercase(Locale.ROOT)\n        .substringBefore('/')\n        .replace("^0+(?=\\\\d)".toRegex(), "")''',
              text,
              count=1
          )
          p.write_text(text)

          c = Path('contracts/cardyssey.openapi.json')
          contract = json.loads(c.read_text())
          props = contract['components']['schemas']['CardPriceQuoteResponse']['properties']
          props['sampleCount'] = {'type': 'integer', 'format': 'int32', 'nullable': True, 'minimum': 0}
          props['updatedAtMs'] = {'type': 'integer', 'format': 'int64', 'nullable': True, 'minimum': 0}
          c.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Generate clients
        run: bash scripts/generate-clients.sh

      - name: Validate platform
        run: docker build -t cardyssey-api-ci platform/api

      - name: Validate web
        working-directory: web
        env:
          CARDYSSEY_API_URL: http://127.0.0.1:8081
          NEXT_PUBLIC_SHOP_URL: https://shop.cardyssey.de
        run: |
          npm ci
          npm run build

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/api/src/main/kotlin/de/cardyssey/api/CardPricing.kt \
                  platform/api/src/main/kotlin/de/cardyssey/api/ExternalPricingProviders.kt \
                  contracts/cardyssey.openapi.json \
                  web/public/contracts/cardyssey.openapi.json \
                  web/public/contracts/cardyssey-android-client.zip
          if ! git diff --cached --quiet; then
            git commit -m "feat: expose central eBay pricing metadata"
            git push
          fi
