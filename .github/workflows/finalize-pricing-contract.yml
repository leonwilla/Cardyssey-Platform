name: Finalize Pricing Contract

on:
  push:
    paths:
      - '.github/workflows/finalize-pricing-contract.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch contract and valuation validation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          spec_path = Path('contracts/cardyssey.openapi.json')
          spec = json.loads(spec_path.read_text())
          schema = spec['components']['schemas']['CollectionItemDto']
          props = schema.setdefault('properties', {})
          map_schema = {
              'type': 'object',
              'additionalProperties': {'type': 'number', 'format': 'double'}
          }
          props['valuedUnitEur'] = map_schema
          props['positionValueEur'] = map_schema
          spec_path.write_text(json.dumps(spec, ensure_ascii=False, indent=2) + '\n')

          route_path = Path('platform/api/src/main/kotlin/de/cardyssey/api/CollectionRoutes.kt')
          text = route_path.read_text()
          text = text.replace(
              '    val conditionFactor = PricingCondition.parse(item.condition)?.factor ?: 1.0\n',
              '    val condition = PricingCondition.parse(item.condition)\n        ?: return item.copy(valuedUnitEur = emptyMap(), positionValueEur = emptyMap())\n    val conditionFactor = condition.factor\n'
          )
          text = text.replace(
              '        condition.isNotBlank() &&\n        quantity in 1..100_000\n',
              '        PricingCondition.parse(condition) != null &&\n        quantity in 1..100_000\n'
          )
          route_path.write_text(text)
          PY

      - name: Generate clients
        run: bash scripts/generate-clients.sh

      - name: Build web
        working-directory: web
        env:
          CARDYSSEY_API_URL: http://127.0.0.1:8081
          NEXT_PUBLIC_SHOP_URL: https://shop.cardyssey.de
        run: |
          npm ci
          npm run build

      - name: Build backend image
        run: docker build -t cardyssey-api-check platform/api

      - name: Verify generated valuation fields
        run: |
          grep -q 'valuedUnitEur' web/lib/generated/cardyssey/src/models/CollectionItemDto.ts
          grep -q 'positionValueEur' web/lib/generated/cardyssey/src/models/CollectionItemDto.ts
          grep -q 'valuedUnitEur' generated/android-client/src/main/kotlin/de/cardyssey/generated/models/CollectionItemDto.kt
          grep -q 'positionValueEur' generated/android-client/src/main/kotlin/de/cardyssey/generated/models/CollectionItemDto.kt

      - name: Commit finalized contract and remove helper
        run: |
          rm .github/workflows/finalize-pricing-contract.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add contracts/cardyssey.openapi.json platform/api/src/main/kotlin/de/cardyssey/api/CollectionRoutes.kt web/public/contracts/cardyssey-android-client.zip .github/workflows/finalize-pricing-contract.yml
          if ! git diff --cached --quiet; then
            git commit -m 'fix: finalize central collection valuation contract'
            git push origin main
          fi
