name: Pricing Response Metadata

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pricing-response-metadata.yml

permissions:
  contents: write

concurrency:
  group: pricing-response-metadata
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add eBay quote metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          pricing = Path('platform/api/src/main/kotlin/de/cardyssey/api/CardPricing.kt')
          text = pricing.read_text()
          old = '''    val exactLanguageMatch: Boolean,
              val exactVariantMatch: Boolean
          )'''
          new = '''    val exactLanguageMatch: Boolean,
              val exactVariantMatch: Boolean,
              val sampleCount: Int? = null,
              val updatedAtMs: Long? = null
          )'''
          if old not in text:
              raise SystemExit('price response anchor not found')
          pricing.write_text(text.replace(old, new, 1))

          ext = Path('platform/api/src/main/kotlin/de/cardyssey/api/ExternalPricingProviders.kt')
          text = ext.read_text()
          anchor = '''class EbaySoldPricingService(
              private val catalog: CardCatalogService,
              private val apiKey: String
          ) {
          '''
          replacement = '''class EbaySoldPricingService(
              private val catalog: CardCatalogService,
              private val apiKey: String
          ) {
              private data class SoldSummary(
                  val baseEur: Double,
                  val sampleCount: Int,
                  val updatedAtMs: Long
              )
          '''
          if anchor not in text:
              raise SystemExit('ebay service anchor not found')
          text = text.replace(anchor, replacement, 1)

          old = '''        val baseEur = if (
                  apiKey.isNotBlank() && exactLanguageMatch && selected != null
              ) {
                  soldMedian(details, selected)
              } else null
          '''
          new = '''        val sold = if (
                  apiKey.isNotBlank() && exactLanguageMatch && selected != null
              ) {
                  soldSummary(details, selected)
              } else null

              val baseEur = sold?.baseEur
          '''
          if old not in text:
              raise SystemExit('ebay quote anchor not found')
          text = text.replace(old, new, 1)

          old = '''            exactLanguageMatch = exactLanguageMatch,
                  exactVariantMatch = exactVariantMatch
              )
          '''
          new = '''            exactLanguageMatch = exactLanguageMatch,
                  exactVariantMatch = exactVariantMatch,
                  sampleCount = sold?.sampleCount,
                  updatedAtMs = sold?.updatedAtMs
              )
          '''
          if old not in text:
              raise SystemExit('ebay response anchor not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              '    private suspend fun soldMedian(\n',
              '    private suspend fun soldSummary(\n',
              1
          )
          old = '''        return median(trimmed).takeIf { it.isFinite() && it > 0.0 }
              }
          '''
          new = '''        val baseEur =
                  median(trimmed)
                      .takeIf { it.isFinite() && it > 0.0 }
                      ?: return null

              return SoldSummary(
                  baseEur = baseEur,
                  sampleCount = trimmed.size,
                  updatedAtMs = System.currentTimeMillis()
              )
              }
          '''
          if old not in text:
              raise SystemExit('sold median return anchor not found')
          text = text.replace(old, new, 1)

          # Normalize card numbers consistently: 025/165 and 025 match on local number.
          old = '''private fun normalizeNumber(raw: String): String =
              raw.trim().lowercase(Locale.ROOT).replace("^0+(?=\\\\d)".toRegex(), "")
          '''
          new = '''private fun normalizeNumber(raw: String): String =
              raw.trim()
                  .lowercase(Locale.ROOT)
                  .substringBefore('/')
                  .replace("^0+(?=\\\\d)".toRegex(), "")
          '''
          if old in text:
              text = text.replace(old, new, 1)
          ext.write_text(text)

          contract_path = Path('contracts/cardyssey.openapi.json')
          contract = json.loads(contract_path.read_text())
          props = contract['components']['schemas']['CardPriceQuoteResponse']['properties']
          props['sampleCount'] = {'type': 'integer', 'format': 'int32', 'nullable': True, 'minimum': 0}
          props['updatedAtMs'] = {'type': 'integer', 'format': 'int64', 'nullable': True, 'minimum': 0}
          contract_path.write_text(json.dumps(contract, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Generate clients
        run: bash scripts/generate-clients.sh

      - name: Build backend
        run: docker build -t cardyssey-api-ci platform/api

      - name: Build web
        working-directory: web
        env:
          CARDYSSEY_API_URL: http://127.0.0.1:8081
          NEXT_PUBLIC_SHOP_URL: https://shop.cardyssey.de
        run: |
          npm ci
          npm run build

      - name: Commit metadata support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/api/src/main/kotlin/de/cardyssey/api/CardPricing.kt \
                  platform/api/src/main/kotlin/de/cardyssey/api/ExternalPricingProviders.kt \
                  contracts/cardyssey.openapi.json \
                  web/public/contracts/cardyssey.openapi.json \
                  web/public/contracts/cardyssey-android-client.zip
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "feat: expose central eBay pricing metadata"
            git push
          fi
