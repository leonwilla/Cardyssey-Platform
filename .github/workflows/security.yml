name: Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  actions: read
  contents: read

jobs:
  dependency-and-build-check:
    name: Dependency and backend build check
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx2g

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Build and test backend
        working-directory: platform/api
        run: gradle test classes --no-daemon --max-workers=1

      - name: Resolve and audit web dependencies
        working-directory: web
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high

  codeql-note:
    name: CodeQL availability
    runs-on: ubuntu-latest
    steps:
      - name: Explain CodeQL repository requirement
        run: |
          echo "CodeQL SARIF upload is intentionally not run here."
          echo "GitHub reports that code scanning is not enabled for this private repository."
          echo "Re-enable the CodeQL analyze job after GitHub Code Scanning is enabled for the repository."
