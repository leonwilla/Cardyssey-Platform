name: Finalize Central Pricing Cleanup

on:
  push:
    paths:
      - '.github/workflows/finalize-pricing-cleanup.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contract and clients
        run: |
          python3 scripts/write-contract.py
          bash scripts/generate-clients.sh

      - name: Verify centralization invariants
        run: |
          grep -q '"valuedUnitEur"' contracts/cardyssey.openapi.json
          grep -q '"positionValueEur"' contracts/cardyssey.openapi.json
          grep -q 'bestOfferAccepted' platform/api/src/main/kotlin/de/cardyssey/api/ExternalPricingProviders.kt
          grep -q 'invalid' platform/api/src/main/kotlin/de/cardyssey/api/ExternalPricingProviders.kt
          grep -q 'linkedMapOf' platform/api/src/main/kotlin/de/cardyssey/api/ExternalPricingProviders.kt
          grep -q 'median' platform/api/src/main/kotlin/de/cardyssey/api/ExternalPricingProviders.kt

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build backend image
        run: docker build -f platform/api/Dockerfile platform/api

      - name: Commit generated outputs and remove helper
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -f contracts/cardyssey.openapi.json web/public/contracts/cardyssey.openapi.json web/public/contracts/cardyssey-android-client.zip web/lib/generated/cardyssey generated/android-client || true
          git rm .github/workflows/finalize-pricing-cleanup.yml
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize central pricing contract"
            git push origin HEAD:main
          fi
