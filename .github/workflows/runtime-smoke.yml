name: Runtime Smoke

on:
  push:
    branches:
      - main
    paths:
      - "scripts/runtime-smoke.sh"
      - ".github/workflows/runtime-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      CARDYSSEY_EBAY_SMOKE_CARD_ID: me05-088
      CARDYSSEY_EBAY_SMOKE_LANGUAGE: de
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Production smoke checks
        run: bash scripts/runtime-smoke.sh
