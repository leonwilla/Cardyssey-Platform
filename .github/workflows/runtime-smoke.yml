name: Runtime Smoke

on:
  push:
    branches:
      - main
    paths:
      - "scripts/runtime-smoke.sh"
      - ".github/workflows/runtime-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Public production smoke checks
        run: bash scripts/runtime-smoke.sh
