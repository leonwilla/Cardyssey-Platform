name: Sync Pricing Contract

on:
  push:
    branches:
      - main
    paths:
      - scripts/sync-pricing-contract.py
      - .github/workflows/sync-pricing-contract.yml

permissions:
  contents: write

concurrency:
  group: sync-pricing-contract
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update OpenAPI contract
        run: python3 scripts/sync-pricing-contract.py

      - name: Validate generated clients
        run: ./scripts/generate-clients.sh

      - name: Commit contract update
        run: |
          if git diff --quiet -- contracts/cardyssey.openapi.json; then
            echo "Pricing contract already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add contracts/cardyssey.openapi.json
            git commit -m "contract: add central pricing API"
            git push
          fi
