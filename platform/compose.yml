services:

  db:
    image: postgres:17-alpine
    container_name: cardyssey-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - cardyssey_postgres:/var/lib/postgresql/data

    networks:
      - cardyssey-internal

    mem_limit: 1g

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  ebay-browser:
    image: selenium/standalone-chromium:latest
    container_name: cardyssey-ebay-browser
    restart: unless-stopped
    shm_size: 2gb

    environment:
      SE_VNC_PASSWORD: secret
      SE_NODE_MAX_SESSIONS: 1
      SE_NODE_OVERRIDE_MAX_SESSIONS: "false"

    ports:
      - "127.0.0.1:7900:7900"

    volumes:
      - cardyssey_ebay_browser:/home/seluser/.config/chromium

    networks:
      - cardyssey-internal

    mem_limit: 2g


  api:
    build:
      context: ./api

    container_name: cardyssey-api
    restart: unless-stopped

    depends_on:
      db:
        condition: service_healthy
      ebay-browser:
        condition: service_started

    environment:
      PORT: 8080

      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      JUSTTCG_API_KEY: ${JUSTTCG_API_KEY:-}
      COMPSNIPER_API_KEY: ${COMPSNIPER_API_KEY:-}
      SOLDCOMPS_API_KEY: ${SOLDCOMPS_API_KEY:-}
      SOLDCOMPS_EBAY_COOKIES: ${SOLDCOMPS_EBAY_COOKIES:-}
      EBAY_DIRECT_COOKIES: ${EBAY_DIRECT_COOKIES:-}
      EBAY_DIRECT_ENABLED: ${EBAY_DIRECT_ENABLED:-true}
      EBAY_BROWSER_URL: http://ebay-browser:4444
      EBAY_PRICE_CACHE_TTL_HOURS: ${EBAY_PRICE_CACHE_TTL_HOURS:-168}

      AVATAR_DIR: /data/avatars
      CATALOG_DIR: /data/catalog
      CATALOG_SYNC_INTERVAL_HOURS: ${CATALOG_SYNC_INTERVAL_HOURS:-24}
      CATALOG_DOWNLOAD_IMAGES: ${CATALOG_DOWNLOAD_IMAGES:-true}
      CATALOG_DETAIL_BATCH_SIZE: ${CATALOG_DETAIL_BATCH_SIZE:-250}
      CATALOG_IMAGE_BATCH_SIZE: ${CATALOG_IMAGE_BATCH_SIZE:-250}
      CATALOG_LANGUAGES: ${CATALOG_LANGUAGES:-de,en,ko,ja,zh-tw,zh-cn}
      PUBLIC_API_URL: https://api.cardyssey.de

    ports:
      - "127.0.0.1:8081:8080"

    volumes:
      - cardyssey_avatars:/data/avatars
      - cardyssey_catalog:/data/catalog

    networks:
      - cardyssey-internal

    mem_limit: 1g


networks:
  cardyssey-internal:
    name: cardyssey-internal


volumes:
  cardyssey_postgres:
    name: cardyssey-postgres

  cardyssey_avatars:
    name: cardyssey-avatars

  cardyssey_catalog:
    name: cardyssey-catalog

  cardyssey_ebay_browser:
    name: cardyssey-ebay-browser
